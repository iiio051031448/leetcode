<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Combination Sum 可视化调试器</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 800px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        
        /* 控制面板 */
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        button { padding: 8px 16px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.secondary { background: #6c757d; }

        /* 可视化区域 */
        .visualization { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .panel { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; min-height: 150px; }
        .panel h3 { margin-top: 0; font-size: 14px; color: #666; text-transform: uppercase; }

        /* 当前状态显示 */
        .state-item { font-family: 'Courier New', Courier, monospace; font-size: 18px; margin: 5px 0; }
        .highlight { color: #e91e63; font-weight: bold; }
        .path-box { display: flex; gap: 5px; min-height: 40px; align-items: center; }
        .path-item { background: #e1f5fe; border: 1px solid #b3e5fc; padding: 2px 8px; border-radius: 4px; }

        /* 日志区域 */
        #log { height: 200px; overflow-y: auto; background: #272822; color: #f8f8f2; padding: 10px; font-family: monospace; border-radius: 4px; font-size: 13px; }
        .log-entry { margin-bottom: 4px; border-left: 3px solid transparent; padding-left: 5px; }
        .log-push { border-color: #a6e22e; color: #a6e22e; } /* 绿色：添加 */
        .log-pop { border-color: #f92672; color: #f92672; }  /* 粉色：回溯 */
        .log-info { border-color: #66d9ef; color: #66d9ef; } /* 蓝色：进入/结束 */

        /* 进度条 */
        .progress-container { width: 100%; background: #eee; height: 8px; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #4caf50; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h2>Combination Sum 可视化</h2>
    
    <div class="controls">
        <button id="btn-start" onclick="initSimulation()">初始化/重置</button>
        <button id="btn-prev" class="secondary" onclick="step(-1)" disabled>上一步</button>
        <button id="btn-play" class="secondary" onclick="togglePlay()" disabled>播放</button>
        <button id="btn-next" class="secondary" onclick="step(1)" disabled>下一步</button>
    </div>

    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="visualization">
        <div class="panel">
            <h3>当前路径 (v)</h3>
            <div id="current-path" class="path-box">--</div>
        </div>
        <div class="panel">
            <h3>剩余目标值 (t)</h3>
            <div id="current-target" class="state-item">0</div>
        </div>
        <div class="panel">
            <h3>当前遍历索引 (i)</h3>
            <div id="current-index" class="state-item">0</div>
        </div>
        <div class="panel">
            <h3>已找到的组合 (res)</h3>
            <div id="results-list" style="font-size: 14px;">[]</div>
        </div>
    </div>

    <h3>执行日志 (Step Log)</h3>
    <div id="log">等待初始化...</div>
</div>

<script>
    /**
     * 核心逻辑：为了实现“回退”，我们不直接运行递归，
     * 而是通过一个特殊的记录器来捕获算法的每一个微小动作。
     */
    let history = []; // 存储所有状态快照
    let currentStepIdx = -1; // 当前播放到的步骤索引
    let isPlaying = false;
    let playInterval = null;

    // 配置参数
    const candidates = [2, 3, 6, 7];
    const target = 7;

    /**
     * 模拟算法并记录快照
     */
    function recordAlgorithm() {
        history = [];
        let res = [];
        let v = [];
        
        // 辅助函数：记录当前状态的深拷贝
        function saveState(type, msg, t, i, currentV) {
            history.push({
                type: type, // 'PUSH', 'POP', 'ENTER', 'EXIT', 'RESULT'
                msg: msg,
                target: t,
                index: i,
                path: [...currentV],
                results: JSON.parse(JSON.stringify(res))
            });
        }

        function dfs(t, start) {
            saveState('ENTER', `进入 DFS (目标值: ${t}, 起始索引: ${start})`, t, start, v);

            if (t === 0) {
                res.push([...v]);
                saveState('RESULT', `找到解! [${v}]`, t, start, v);
                return;
            }

            for (let i = start; i < candidates.length && t >= candidates[i]; ++i) {
                // 1. 做选择
                v.push(candidates[i]);
                saveState('PUSH', `选择 ${candidates[i]}`, t - candidates[i], i, v);

                // 2. 递归
                dfs(t - candidates[i], i);

                // 3. 回溯
                v.pop();
                saveState('POP', `回溯 (撤销 ${candidates[i]})`, t, i, v);
            }
        }

        // 初始化排序并开始记录
        const sortedCandidates = [...candidates].sort((a, b) => a - b);
        dfs(target, 0);
    }

    // --- UI 控制逻辑 ---

    function initSimulation() {
        stopPlay();
        recordAlgorithm(); // 预执行，生成历史记录
        currentStepIdx = 0;
        updateUI();
        
        document.getElementById('btn-next').disabled = false;
        document.getElementById('btn-prev').disabled = false;
        document.getElementById('btn-play').disabled = false;
        document.getElementById('log').innerHTML = '<div class="log-entry log-info">算法已初始化，准备就绪。</div>';
    }

    function step(direction) {
        const newIdx = currentStepIdx + direction;
        if (newIdx >= 0 && newIdx < history.length) {
            currentStepIdx = newIdx;
            updateUI();
        } else if (newIdx >= history.length) {
            stopPlay();
        }
    }

    function togglePlay() {
        if (isPlaying) stopPlay();
        else startPlay();
    }

    function startPlay() {
        isPlaying = true;
        document.getElementById('btn-play').innerText = "暂停";
        playInterval = setInterval(() => {
            if (currentStepIdx < history.length - 1) {
                step(1);
            } else {
                stopPlay();
            }
        }, 600); // 每600ms走一步
    }

    function stopPlay() {
        isPlaying = false;
        document.getElementById('btn-play').innerText = "播放";
        clearInterval(playInterval);
    }

    function updateUI() {
        const state = history[currentStepIdx];
        if (!state) return;

        // 更新数值显示
        document.getElementById('current-target').innerText = state.target;
        document.getElementById('current-index').innerText = state.index;
        
        // 更新路径显示
        const pathContainer = document.getElementById('current-path');
        pathContainer.innerHTML = '';
        if (state.path.length === 0) {
            pathContainer.innerHTML = '--';
        } else {
            state.path.forEach(num => {
                const span = document.createElement('span');
                span.className = 'path-item';
                span.innerText = num;
                pathContainer.appendChild(span);
            });
        }

        // 更新结果列表
        document.getElementById('results-list').innerText = JSON.stringify(state.results);

        // 更新日志
        const logDiv = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${state.type.toLowerCase()}`;
        entry.innerText = `[Step ${currentStepIdx}] ${state.msg}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight; // 滚动到底部

        // 更新进度条
        const progress = (currentStepIdx / (history.length - 1)) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
    }
</script>

</body>
</html>
